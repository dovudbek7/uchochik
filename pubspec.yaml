name: uchochik
description: Field Application Utility Tool for DLMS/COSEM smart meter configuration.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  # Navigation
  go_router: ^14.2.7
  # DI
  get_it: ^8.0.2
  # Local DB
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  # Immutable domain models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  # Sensitive data encryption (meter keys stored AES-256)
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2
  # USB Serial — OTG optical probe
  usb_serial: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  isar_generator: ^3.1.0+1
  # Pinned: freezed 2.5.x uses source_gen ^2, conflicts with isar_generator (needs source_gen ^1.4)
  freezed: '>=2.4.6 <2.5.8'
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
